services:
  database:
    image: postgres:15-alpine
    container_name: colegio_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: iepCayros
      POSTGRES_DB: colegio_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - colegio-net

volumes:
  pgdata:

networks:
  colegio-net:
    driver: bridge